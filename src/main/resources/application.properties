spring.application.name=transaction-service
server.port=9094

#spring.datasource.url=jdbc:postgresql://localhost:5432/doc_generation_db
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=manager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
logging.level.org.hibernate.SQL=DEBUG
app.security.api-key=${TRANSACTION_API_KEY:}
app.security.read-only-api-key=${TRANSACTION_READONLY_API_KEY:}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
app.retry.poll-interval-ms=${TRANSACTION_RETRY_POLL_INTERVAL_MS:1000}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
